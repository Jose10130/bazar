<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Inicio Dinámico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --pink-accent: #e91e63;
        }

        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 2px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            height: 100%;
            transition: transform 0.2s;
            position: relative;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(233, 30, 99, 0.7);
            color: white;
            padding: 2px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            z-index: 1;
        }

        .product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 0.9rem;
            margin-right: 5px;
        }

        .current-price {
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-buy {
            border: 2px solid var(--pink-accent);
            color: var(--pink-accent);
            background: transparent;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 8px 4px;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-buy:hover {
            background-color: var(--pink-accent);
            color: white;
        }

        .float-whatsapp {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 100;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-light bg-white border-bottom sticky-top">
        <div class="container text-center justify-content-center flex-column">
            <span class="navbar-brand mb-0 h1">INICIO</span>
            <div class="input-group mt-2" style="max-width: 400px;">
                <input type="text" class="form-control form-control-sm border-end-0" placeholder="Qué Buscas?">
                <span class="input-group-text bg-white border-start-0">
                    <i class="fas fa-search text-muted"></i>
                </span>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-3" id="contenedor-productos">
            </div>
    </div>

    <a href="#" class="float-whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Array de productos (Simula tu base de datos)
        // Puedes agregar 8, 12, 16 o los que quieras, el grid se ajusta solo.
        const productos = [
    { 
        nombre: "Anteojos de moda", 
        precioV: 4999, 
        precioA: 3899, 
        desc: 22, 
        img: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Paleta con sombras", 
        precioV: 7999, 
        precioA: 6500, 
        desc: 19, 
        img: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Set Profesional Pinceles", 
        precioV: 2600, 
        precioA: 1999, 
        desc: 23, 
        img: "https://images.unsplash.com/photo-1522338221030-844a21350101?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Caja de Tips Soft Gel", 
        precioV: 3999, 
        precioA: 3200, 
        desc: 20, 
        img: "https://plus.unsplash.com/premium_photo-1670537994863-5ad53a3214e0?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Arqueador Profesional", 
        precioV: 2500, 
        precioA: 1800, 
        desc: 25, 
        img: "https://images.unsplash.com/photo-1590439471364-192aa70c0b53?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Espejo Stitch", 
        precioV: 1500, 
        precioA: 1350, 
        desc: 10, 
        img: "https://m.media-amazon.com/images/I/61m6-N+M7BL._AC_SL1000_.jpg" 
    },
    { 
        nombre: "Labial Larga Duración", 
        precioV: 1200, 
        precioA: 850, 
        desc: 29, 
        img: "https://images.unsplash.com/photo-1586776977607-310e9c725c37?q=80&w=500&auto=format&fit=crop" 
    },
    { 
        nombre: "Pinceles de Precisión", 
        precioV: 2600, 
        precioA: 1999, 
        desc: 23, 
        img: "https://images.unsplash.com/photo-1625093742435-6fa192b6fb10?q=80&w=500&auto=format&fit=crop" 
    }
];

        function renderizarTienda() {
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = ""; // Limpiar antes de cargar

            productos.forEach(p => {
                const html = `
                    <div class="col-6 col-md-3">
                        <div class="product-card p-2 text-center d-flex flex-column justify-content-between">
                            <div>
                                <span class="discount-badge">-${p.desc}%</span>
                                <img src="${p.img}" class="product-img mb-2">
                                <p class="product-title px-1">${p.nombre}</p>
                            </div>
                            <div>
                                <div class="price-container mb-2">
                                    <span class="old-price">$ ${p.precioV}</span>
                                    <span class="current-price">$ ${p.precioA}</span>
                                </div>
                                <button class="btn btn-buy">Comprar Ahora</button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += html;
            });
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', renderizarTienda);
    </script>
</body>
</html>
