<body class="bg-background text-on-background font-body-lg min-h-screen flex items-center justify-center p-mobile-margin md:p-gutter">
<!-- Top Navigation Omitted because this is a transactional page (Login) -->
<main class="w-full max-w-[440px] mx-auto relative z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1),0px_2px_4px_-1px_rgba(0,0,0,0.06)] p-card-padding flex flex-col gap-6 relative overflow-hidden">
<!-- Brand Logo / Header -->
<div class="flex flex-col items-center justify-center text-center space-y-2 mb-2">
<div class="flex items-center justify-center bg-primary rounded-full w-16 h-16 mb-2 shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]">storefront</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">Bazar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Accede a tu panel de administración</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 w-full">
<!-- Email Field (Error State Example) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-error text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-error-container/30 border-2 border-error text-on-surface rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:ring-0 placeholder:text-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="tu@email.com" type="email" value=""/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-error text-[20px]">error</span>
</div>
</div>
<p class="font-body-md text-body-md text-error text-xs mt-0.5">El campo Email es obligatorio.</p>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-[#f1f5f9] border border-outline-variant text-on-surface rounded-DEFAULT font-body-md text-body-md focus:bg-surface-container-lowest focus:border-secondary focus:outline-none focus:ring-0 placeholder:text-on-surface-variant/50 transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3 px-4 rounded-DEFAULT hover:opacity-90 transition-opacity flex justify-center items-center gap-2 shadow-sm border border-transparent" type="submit">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-body-md text-body-md text-sm">o</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<a class="w-full bg-surface-container-lowest text-primary font-label-md text-label-md py-3 px-4 rounded-DEFAULT hover:bg-surface-container-low transition-colors flex justify-center items-center gap-2 border border-outline-variant text-center" href="#">
                        Crear una cuenta
                    </a>
</div>
</form>
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-secondary to-primary-fixed"></div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-8 font-body-md text-body-md text-on-surface-variant text-sm">
<a class="hover:text-primary transition-colors" href="#">Términos de Servicio</a>
<span class="hidden sm:inline text-outline-variant">•</span>
<a class="hover:text-primary transition-colors" href="#">Política de Privacidad</a>
<span class="hidden sm:inline text-outline-variant">•</span>
<a class="hover:text-primary transition-colors" href="#">Soporte</a>
