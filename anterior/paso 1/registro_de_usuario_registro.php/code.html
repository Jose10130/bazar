<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-mobile-margin">
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1),0px_2px_4px_-1px_rgba(0,0,0,0.06)] p-8">
<div class="text-center mb-8">
<h1 class="font-headline-xl text-headline-xl text-primary font-bold tracking-tight mb-2">Bazar</h1>
<h2 class="font-headline-md text-headline-md text-on-surface">Crear una cuenta</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Ingresa tus datos para registrarte</p>
</div>
<form class="space-y-5">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="fullName">Nombre Completo</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="fullName" name="fullName" placeholder="Ej. Juan Pérez" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="email">email</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="password" minlength="6" name="password" placeholder="Mínimo 6 caracteres" required="" type="password"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5" for="confirmPassword">Confirmar Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container border border-transparent rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="confirmPassword" minlength="6" name="confirmPassword" placeholder="Repite tu contraseña" required="" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full flex items-center justify-center bg-secondary text-on-secondary font-label-md text-label-md py-3 px-4 rounded-lg hover:opacity-90 transition-opacity border border-transparent" type="submit">
                    Registrarse
                </button>
</div>
</form>
<div class="mt-8 text-center">
<span class="font-body-md text-body-md text-on-surface-variant">¿Ya tienes cuenta?</span>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container ml-1 transition-colors" href="#">
                Ya tengo cuenta, iniciar sesión
            </a>
</div>
